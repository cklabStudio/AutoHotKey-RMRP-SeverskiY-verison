9.14=Проезд на красный сигнал светофора, а равно проезд на запрещающий жест регулировщика, или на жёлтый сигнал светофора при возможности совершить остановку, не повлекшую создание опасности для движения иных участников дорожного движения (см. статья 5.2 ПДД) – влечет наложение административного штрафа в размере двадцати пяти тысяч (25.000) рублей.
9.15=Невыполнение требования Правил дорожного движения об остановке перед стоп-линией, обозначенной дорожными знаками или разметкой проезжей части дороги, при запрещающем сигнале светофора или запрещающем жесте регулировщика (см. статья 5.5 ПДД), – влечет наложение административного штрафа в размере тридцати пяти тысяч (35.000) рублей.
