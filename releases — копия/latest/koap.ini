6.4=Отсутствие действующей медицинской книжки у сотрудника государственной организации, который в порядке, предусмотренном законодательством Российской Федерации обязан следить за своим здоровьем, – влечет наложение административного штрафа в размере от пятнадцати тысяч (15.000) до двадцати пяти тысяч (25.000) рублей.
