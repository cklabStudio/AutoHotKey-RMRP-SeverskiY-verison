9.34=Нарушения правил проезда перекрёстков, не повлекшие опасности другим участникам движения (см. глава XI ПДД), – влечет наложение административного штрафа в размере десяти тысяч (10.000) рублей.
9.35=Нарушения правил проезда перекрёстков, повлекшие опасность другим участникам движения (см. глава XI ПДД), – влечет наложение административного штрафа в размере пятнадцати тысяч (15.000) рублей.
