9.20=Движение по полосе, предназначенной для встречного движения, в нарушение правил дорожного движения (см. статья 7.1 ПДД) – влечет наложение административного штрафа в размере тридцати тысяч (30.000) рублей, или лишение права на управление транспортным средством.
