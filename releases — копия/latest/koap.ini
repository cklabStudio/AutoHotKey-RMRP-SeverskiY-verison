9.30=Остановка или стоянка транспортных средств на пешеходном переходе и ближе 5 метров перед ним, остановка или стоянка транспортных средств на тротуаре (см. статья 10.3 ПДД), – влечет наложение административного штрафа в размере пятнадцати тысяч (15.000) рублей.
