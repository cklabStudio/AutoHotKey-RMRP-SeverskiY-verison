1.3=Участники дорожного движения обязаны знать и соблюдать относящиеся к ним требования Правил, сигналов светофоров, знаков и разметки, а также выполнять распоряжения регулировщиков, действующих в пределах предоставленных им прав и регулирующих дорожное движение.
1.5=Под опасным вождением понимается управление транспортным средством, выражающееся в неоднократном совершении одного или совершении нескольких следующих друг за другом действий, заключающихся в невыполнении при перестроении требования уступить дорогу транспортному средству, пользующемуся преимущественным правом движения, перестроении при интенсивном движении, когда все полосы движения заняты, кроме случаев поворота налево или направо, разворота, остановки или объезда препятствия, несоблюдении безопасной дистанции до движущегося впереди транспортного средства, несоблюдении бокового интервала, резком торможении, если такое торможение не требуется для предотвращения дорожно-транспортного происшествия, препятствовании обгону, если указанные действия повлекли создание водителем в процессе дорожного движения ситуации, при которой его движение и (или) движение иных участников дорожного движения в том же направлении и с той же скоростью создает угрозу гибели или ранения людей, повреждения транспортных средств, сооружений, грузов или причинения иного материального ущерба.
2.1=Водитель транспортного средства обязан иметь при себе и по требованию сотрудников ГИБДД передавать им для проверки:

а) водительское удостоверение;
б) технический паспорт транспортного средства;
в) разрешение на управление транспортным средством (в случае временного пользования, документ пишется от имени владельца).
2.3=По требованию сотрудника ГИБДД водитель обязан проходить освидетельствование на состояние алкогольного опьянения.
2.4=Водителю запрещается управлять транспортным средством:

а) в состоянии опьянения (алкогольного, наркотического или иного), под воздействием лекарственных препаратов, ухудшающих реакцию и внимание, в болезненном или утомленном состоянии, ставящем под угрозу безопасность движения;
б) в случае отсутствия у него действующего водительского удостоверения.
2.6=При дорожно-транспортном происшествии (далее — ДТП) водитель, причастный к нему, обязан незамедлительно остановить (не трогать с места) транспортное средство, включить аварийную сигнализацию и выставить знак аварийной остановки, не перемещать предметы, имеющие отношение к происшествию, после чего вызвать сотрудников дорожно-патрульной службы. Дальнейшие действия водителя определяются сотрудниками ГИБДД.
2.7=Пассажиры обязаны:

а) при поездке на транспортном средстве, оборудованном ремнями безопасности, быть пристегнутыми ими, а при поездке на мотоцикле — быть в застегнутом мотошлеме;
б) посадку и высадку производить со стороны тротуара или обочины и только после полной остановки транспортного средства.
Если посадка и высадка невозможна со стороны тротуара или обочины, она может осуществляться со стороны проезжей части при условии, что это будет безопасно и не создаст помех другим участникам движения.
3.1=Водители транспортных средств с включенным проблесковым маячком синего цвета, выполняя неотложное служебное задание, могут отступать от требований главы 5 (кроме сигналов регулировщика) и иных глав настоящих Правил. Для получения преимущества перед другими участниками движения водители таких транспортных средств должны включить проблесковый маячок синего цвета и специальный звуковой сигнал. Воспользоваться приоритетом они могут только убедившись, что им уступают дорогу. Этим же правом пользуются водители транспортных средств, сопровождаемых транспортными средствами, имеющими нанесенные на наружные поверхности специальные цветографические схемы, с включенными проблесковыми маячками синего и красного цветов и специальным звуковым сигналом, в случаях, установленных настоящей статьей.
3.2=При приближении транспортного средства с включенными проблесковым маячком синего цвета и специальным звуковым сигналом водители обязаны уступить дорогу для обеспечения беспрепятственного проезда указанного транспортного средства. При приближении транспортного средства, имеющего нанесенные на наружные поверхности специальные цветографические схемы, с включенными проблесковыми маячками синего и красного цветов и специальным звуковым сигналом водители обязаны уступить дорогу для обеспечения беспрепятственного проезда указанного транспортного средства, а также сопровождаемого им транспортного средства (сопровождаемых транспортных средств). Запрещается выполнять обгон транспортного средства, имеющего нанесенные на наружные поверхности специальные цветографические схемы с включенными проблесковым маячком синего цвета и специальным звуковым сигналом.
3.7=Аварийная сигнализация должна быть включена:

а) при дорожно-транспортном происшествии;
б) при вынужденной остановке в местах, где остановка запрещена (вынужденная остановка должна быть связана с технической неисправностью, не позволяющей дальнейшее движение);
в) при ослеплении водителя светом фар;
г) при буксировке (на буксируемом транспортном средстве).
3.8=Звуковые сигналы могут применяться только:

а) для предупреждения других водителей о намерении произвести обгон вне населенных пунктов;
б) в случаях, когда это необходимо для предотвращения дорожно-транспортного происшествия.
3.9=В темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве должны быть включены фары дальнего или ближнего света. Дальний свет должен быть переключен на ближний в населенных пунктах, если дорога освещена. В светлое время суток на всех движущихся транспортных средствах (кроме велосипедов) с целью их обозначения должны включаться фары ближнего света или дневные ходовые огни.
5.2=Круглые сигналы светофора имеют следующие значения: ЗЕЛЕНЫЙ СИГНАЛ разрешает движение; ЖЕЛТЫЙ СИГНАЛ запрещает движение, кроме случаев, предусмотренных пунктом 6.14 Правил, и предупреждает о предстоящей смене сигналов; КРАСНЫЙ СИГНАЛ, в том числе мигающий, запрещает движение.
5.4=Требование об остановке транспортного средства подается с помощью громкоговорящего устройства или жестом руки, направленной на транспортное средство. Водитель должен остановиться в указанном ему месте.
5.5=При запрещающем сигнале светофора или регулировщика водители должны остановиться перед стоп-линией, а при ее отсутствии на перекрестке — перед пересекаемой проезжей частью, перед железнодорожным переездом, в других местах — перед светофором или регулировщиком, не создавая помех транспортным средствам и пешеходам, движение которых разрешено.
6.1=Перед началом движения, перестроением, поворотом (разворотом) и остановкой водитель обязан подавать сигналы световыми указателями поворота соответствующего направления. При выполнении маневра не должны создаваться опасность для движения, а также помехи другим участникам дорожного движения.
6.3=При выезде на дорогу с прилегающей территории водитель должен уступить дорогу транспортным средствам, лицам, использующим для передвижения средства индивидуальной мобильности, и пешеходам, движущимся по ней, а при съезде с дороги — пешеходам, велосипедистам путь движения которых он пересекает.
6.4=При перестроении водитель должен уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения. При одновременном перестроении транспортных средств, движущихся попутно, водитель должен уступить дорогу транспортному средству, находящемуся справа.
6.5=Перед поворотом направо, налево или разворотом водитель обязан заблаговременно занять соответствующее крайнее положение на проезжей части, предназначенной для движения в данном направлении, кроме случаев, когда совершается поворот при въезде на перекресток, где организовано круговое движение.
6.6=Поворот должен осуществляться таким образом, чтобы при выезде с пересечения проезжих частей транспортное средство не оказалось на стороне встречного движения.
6.7=Если транспортное средство из-за своих габаритов или по другим причинам не может выполнить поворот с соблюдением требований статьи 6.5 Правил, допускается отступать от них при условии обеспечения безопасности движения и если это не создаст помех другим транспортным средствам.
6.8=При повороте налево или развороте вне перекрестка водитель безрельсового транспортного средства обязан уступить дорогу встречным транспортным средствам. При развороте от правого края проезжей части водитель должен уступить дорогу попутным и встречным транспортным средствам.
7.1=На любых дорогах с двусторонним движением запрещается движение по полосе, предназначенной для встречного движения, если она отделена разделительной полосой, разметкой 2.1, 2.2.
7.2=На дорогах с двусторонним движением, имеющих четыре или более полосы, запрещается выезжать для обгона или объезда на полосу, предназначенную для встречного движения.
7.4=Вне населенных пунктов, а также в населенных пунктах на дорогах, обозначенных знаком 1.41 или где разрешено движение со скоростью более 80 км/ч, водители транспортных средств должны вести их по возможности ближе к правому краю проезжей части. Запрещается занимать левые полосы движения при свободных правых.
7.5=Если проезжая часть разделена на полосы линиями разметки, движение транспортных средств должно осуществляться строго по обозначенным полосам. Наезжать на прерывистые линии разметки разрешается лишь при перестроении.
7.7=Запрещается движение транспортных средств по разделительным полосам и обочинам, тротуарам и пешеходным дорожкам (за исключением случаев, предусмотренных статьями настоящих Правил).
7.8=Водитель должен соблюдать такую дистанцию до движущегося впереди транспортного средства, которая позволила бы избежать столкновения, а также необходимый боковой интервал, обеспечивающий безопасность движения.
8.1=Водитель должен вести транспортное средство со скоростью, не превышающей установленного ограничения, учитывая при этом интенсивность движения, особенности и состояние транспортного средства и груза, дорожные и метеорологические условия.
9.3=Водителю обгоняемого транспортного средства запрещается препятствовать обгону посредством повышения скорости движения или иными действиями.
9.4=Обгон запрещен: на регулируемых перекрестках, а также на нерегулируемых перекрестках при движении по дороге, не являющейся главной; на пешеходных переходах; на железнодорожных переездах и ближе чем за 100 метров перед ними; на мостах, путепроводах, эстакадах и под ними, а также в тоннелях; в конце подъема, на опасных поворотах и на других участках с ограниченной видимостью.
10.3=Остановка запрещается: на железнодорожных переездах, в тоннелях, на эстакадах, мостах, путепроводах (если для движения в данном направлении имеется менее трех полос) и под ними; в местах, где расстояние между встречной полосой движения и остановившимся транспортным средством менее 3 м; на пешеходных переходах и ближе 5 м перед ними; на пересечении проезжих частей и ближе 5 м от края пересекаемой проезжей части; на островках направляющих и островках безопасности.
11.7=На перекрестке неравнозначных дорог водитель транспортного средства, движущегося по второстепенной дороге, должен уступить дорогу транспортным средствам, приближающимся по главной, независимо от направления их дальнейшего движения.
12.1=На автомагистралях запрещается: движение пешеходов, велосипедов, мопедов, иных транспортных средств, скорость которых по технической характеристике или их состоянию менее 40 км/ч; движение грузовых автомобилей с разрешенной максимальной массой более 3,5 т далее второй полосы; остановка вне специальных площадок для стоянки; разворот и въезд в технологические разрывы разделительной полосы; движение задним ходом.
13.1=Техническое состояние и оборудование транспортных средств, участвующих в дорожном движении, должны обеспечивать безопасность дорожного движения. Обязанность по поддержанию транспортных средств, участвующих в дорожном движении, в технически исправном состоянии возлагается на владельцев транспортных средств либо на лиц, эксплуатирующих транспортные средства.
13.2=Запрещена эксплуатация транспортного средства при:

а) отсутствии государственных регистрационных знаков;
б) неисправности двигателя, его технического состояния менее 50% по техническому паспорту транспортного средства;
в) прочих технических неисправностях, мешающих движению и создающих опасность, утвержденных постановлением Правительства РФ.
13.3=Запрещена зеркальная тонировка. Примечание: тонировка, поверхность которой способна образовывать оптические изображения предметов (в том числе источников света), отражая световые лучи.
13.4=Запрещена эксплуатация транспортного средства, на котором установлена тонировка, более 75% на боковых передних и лобовом стеклах (в том числе запрещены цветные пленки).
14.1=Водитель транспортного средства, приближающегося к нерегулируемому пешеходному переходу (понятие аналогичное нерегулируемому перекрестку), обязан уступить дорогу пешеходам, переходящим дорогу или вступившим на проезжую часть (трамвайные пути) для осуществления перехода.
14.7=В населенных пунктах водители должны уступать дорогу троллейбусам и автобусам, начинающим движение от обозначенного места остановки.
4 глава=Обязанности пешеходов и велосипедистов (глава IV ПДД). Пешеходы должны двигаться по тротуарам или пешеходным переходам; велосипедисты — по велосипедным, велопешеходным дорожкам или по правому краю проезжей части в установленных случаях.
10 глава=Остановка и стоянка (глава X ПДД). Остановка и стоянка разрешаются на правой стороне на обочине, а при ее отсутствии — у края проезжей части. Запрещаются остановка и стоянка в тоннелях, на мостах, на пешеходных переходах и ближе 5 м перед ними, на остановках маршрутных ТС и ближе 15 м и т.д.
11 глава=Проезд перекрестков (глава XI ПДД). Очередность на регулируемых перекрестках определяется сигналами светофора или регулировщика; на неравнозначных дорогах водитель по второстепенной уступает ТС по главной.

