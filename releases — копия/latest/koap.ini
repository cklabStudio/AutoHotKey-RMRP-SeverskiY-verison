10.1=Неисполнение требований законодательства Российской Федерации о внешнем виде сотрудников (служащих) государственных организаций (органов), – влечет наложение административного штрафа в размере от пятидесяти тысяч (50.000) до шестидесяти тысяч (60.000) рублей.
10.2=Неисполнение требований законодательства Российской Федерации в сфере этики работников государственных организаций, – влечет наложение административного штрафа в размере от двадцати пяти тысяч (25.000) до пятидесяти тысяч (50.000) рублей.
10.3=Взлет воздушного судна государственной без установленного законодательством о воздушном пространстве уведомления о взлете, посадка воздушного судна государственной без установленного законодательством о воздушном пространстве уведомления о посадке, – влечет наложение административного штрафа в размере от пятидесяти тысяч (50.000) до ста тысяч (100.000) рублей.
10.4=Нарушение иных правил пользования воздушным пространством, установленных законодательством о воздушном пространстве, – влечет наложение административного штрафа в размере от пятидесяти тысяч (50.000) до ста тысяч (100.000) рублей.
11.1=Нарушения правил оформления реквизитов, а равно использование иных реквизитов, не предусмотренных законодательством о документообороте, – влечет наложение административного штрафа в размере от двадцати тысяч (20.000) до пятидесяти тысяч (50.000) рублей.
11.2=Нарушение общих требований к созданию документов, установленных законодательством о документообороте, – влечет наложение административного штрафа в размере от пятидесяти тысяч (50.000) до семидесяти пяти тысяч (75.000) рублей.
11.3=Нарушение иных специальных требований к созданию документов, установленных законодательством о документообороте, – влечет наложение административного штрафа в размере от двадцати тысяч (20.000) до тридцати пяти тысяч (35.000) рублей.