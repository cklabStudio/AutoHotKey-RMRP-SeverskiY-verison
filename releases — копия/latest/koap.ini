4.7=Совершение административного правонарушения, предусмотренного главой IX настоящего Кодекса государственным служащим вне зависимости от того находится ли государственный служащий при исполнении служебных обязанностей или нет, в случае избрания административного наказания в виде административного штрафа, административный штраф накладывается в двойном размере.
