8.12=Ношение масок в общественном месте скрывающем лицо, кроме медицинских масок, купленных в специализированном магазине, а также за исключением ношения декоративных масок на мероприятиях, санкционированных Правительством Российской Федерации, – влечет наложение административного штрафа в размере от десяти тысяч (10.000) до пятнадцати тысяч (15.000) рублей.
8.13=Нарушение требований законодательства об оружии, выражающееся в открытом ношении холодного оружия в общественных местах, – влечет наложение административного штрафа в размере от пятнадцати тысяч (15.000) до двадцати тысяч (20.000) рублей.
8.14=Курение табака, потребление никотин содержащей продукции или использование кальянов в общественных местах, – влечет наложение административного штрафа в размере от пяти тысяч (5.000) до десяти тысяч (10.000) рублей.
