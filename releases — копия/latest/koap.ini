9.42=Управление транспортным средством в состоянии опьянения или передача управления транспортным средством лицу, находящемуся в состоянии опьянения (см. статья 2.4 ПДД) – влечет наложение административного штрафа в размере тридцати тысяч (30.000) рублей, или лишение права на управление транспортным средством.
