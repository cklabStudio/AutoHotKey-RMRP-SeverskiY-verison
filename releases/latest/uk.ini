58=Создание устойчивой вооруженной группы (банды) в целях нападения на граждан или организации, а равно руководство такой группой (бандой) (бандитизм), – наказывается лишением свободы на срок восьми лет (СПРП «★★★★★★»).
59=Угон судна воздушного или водного транспорта, а равно захват такого судна в целях угона, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
60=Организация массовых беспорядков, сопровождавшихся насилием, погромами, поджогами, уничтожением имущества, применением оружия, взрывных устройств, взрывчатых, отравляющих либо иных веществ и предметов, представляющих опасность для окружающих, а также оказанием вооруженного сопротивления представителю власти, а равно подготовка лица для организации таких массовых беспорядков или участия в них, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
61=Хулиганство, то есть грубое нарушение общественного порядка, выражающее явное неуважение к обществу, совершенное:

а) с применением насилия к гражданам либо угрозой его применения;
б) по мотивам политической, идеологической, расовой, национальной или религиозной ненависти или вражды либо по мотивам ненависти или вражды в отношении какой-либо социальной группы;
в) на железнодорожном, морском, внутреннем водном или воздушном транспорте, а также на любом ином транспорте общего пользования,

– наказываются штрафом в размере двадцати тысяч (20.000) рублей или лишением свободы на срок трех лет (СПРП «★★»).
62.1=Незаконное проникновение или нахождение на объекте, закрытом для общего доступа в соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, – наказываются штрафом в размере сорока тысяч (40.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★»).
62.2=То же деяние, сопряженное с совершением одного или нескольких преступлений, предусмотренных статьями 48.2, 49.3, 53, 59, 75, 87, 89, 90.2, 94 настоящего Кодекса, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
62.3=Незаконное проникновение или нахождение на объекте, принадлежащем воинским формированиям (воинские части), закрытом для общего доступа в соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, – наказываются штрафом в размере восьмидесяти тысяч (80.000) рублей или лишением свободы на срок пяти лет (СПРП «★★★»).
62.4=Незаконное проникновение или нахождение на объекте, закрытом для общего доступа в соответствии с законодательством Российской Федерации о закрытых и охраняемых территориях, государственным служащим, – наказываются штрафом в размере шестиста тысяч (600.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★»).
63.1=Незаконное приобретение, хранение, передача, сбыт или ношение оружия, его основных частей, материалов для его создания в количестве от ста (100) единиц, – наказывается лишением свободы на срок четырех лет (СПРП «★★★»).
63.2=Незаконное приобретение, использование, хранение, передача, сбыт или ношение запрещённых средств индивидуальной защиты (бронежилеты 3–4 класса и т.п.), – наказывается лишением свободы на срок четырех лет (СПРП «★★★»).
63.3=Ношение огнестрельного оружия в открытой форме либо его демонстративное использование в общественных местах вне рамок, предусмотренных законодательством Российской Федерации, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
63.4=Причинение вреда здоровью с использованием оружия, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
64=Незаконные приобретение, хранение, перевозка, изготовление, переработка без цели сбыта наркотических средств, психотропных веществ или их аналогов, а также незаконные приобретение, хранение, перевозка реагентов, прекурсоров для изготовления наркотических средств, психотропных веществ или их аналогов, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
64.1=Незаконные производство, сбыт или пересылка наркотических средств, психотропных веществ или их аналогов, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
65=Организация или вовлечение в занятие проституцией или принуждение к продолжению занятия проституцией, – наказывается лишением свободы на срок четырех лет (СПРП «★★»).
66=Жестокое обращение с животным в целях причинения ему боли и (или) страданий, а равно из хулиганских побуждений или из корыстных побуждений, повлекшее его гибель или увечье, – наказывается лишением свободы на срок четырех лет (СПРП «★★»).
67.1=Неуплата или отказ от уплаты штрафа лицом, если штраф или сумма штрафов не превышает тридцати тысяч (30.000) рублей, – наказывается лишением свободы на срок трех лет (СПРП «★★★»).
67.2=Неуплата или отказ от уплаты штрафа лицом, если штраф или сумма штрафов составляет тридцать и более тысяч (30.000) рублей, но не превышает пятидесяти тысяч (50.000) рублей, – наказывается лишением свободы на срок пяти лет (СПРП «★★★»).
67.3=Неуплата или отказ от уплаты штрафа лицом, если штраф или сумма штрафов составляет пятьдесят и более тысяч (50.000) рублей, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
68.1=Нарушение лицом, управляющим автомобилем либо другим транспортным средством, правил дорожного движения или эксплуатации транспортных средств, повлекшее по неосторожности причинение тяжкого вреда здоровью человека, – наказывается лишением свободы на срок трех лет (СПРП «★★★»).
68.2=Деяние, предусмотренное частью первой настоящей статьи, повлекшее по неосторожности смерть человека, – наказывается лишением свободы на срок четырех лет (СПРП «★★★★»).
68.3=Неисполнение предписаний представителей органа, уполномоченного в соответствии с законодательством Российской Федерации осуществлять надзор в сфере безопасности дорожного движения, – наказывается штрафом в размере двадцати тысяч (20.000) рублей или лишением свободы на срок двух лет (СПРП «★★»).
68.4=Причинение вреда здоровью человеку, совершая на него наезд транспортным средством, – наказывается штрафом в размере тридцати тысяч (30.000) рублей или лишением свободы на срок двух лет (СПРП «★★»).
68.5=Деяние, предусмотренное частью первой настоящей статьи, совершенное сотрудником государственной организации при исполнении служебных обязанностей, – наказывается лишением свободы на срок пяти лет (СПРП «★★★★»).
69=Государственная измена, то есть совершенные гражданином Российской Федерации шпионаж, выдача иностранному государству, международной либо иностранной организации или их представителям сведений, составляющих государственную тайну (определяется судом), – наказывается лишением свободы на срок пятнадцати лет (СПРП «★★★★★★»).
70=Посягательство на жизнь государственного или общественного деятеля, совершенное в целях прекращения его государственной или иной политической деятельности либо из мести за такую деятельность, – наказывается лишением свободы на срок пяти лет (СПРП «★★★★»).
Примечание: Под государственными или общественными деятелями признаются Губернатор Федерального округа, Вице-губернатор Федерального округа, Председатель законодательного собрания Федерального округа и его заместители, депутаты законодательного собрания Федерального округа, министры Федерального округа, судьи, Президент адвокатской палаты, руководитель следственного органа Следственного комитета Российской Федерации по субъекту Российской Федерации и его заместители, прокурор субъекта Российской Федерации и его заместители, Председатель Следственного комитета Российской Федерации и его заместители, Генеральный прокурор Российской Федерации и его заместители, сенаторы совета федерации Российской Федерации, Председатель совета Федерации Российской Федерации.
71=Организация вооруженного мятежа либо активное участие в нем в целях свержения или насильственного изменения конституционного строя Российской Федерации либо нарушения территориальной целостности Российской Федерации (определяется судом), – наказывается лишением свободы на срок десяти лет (СПРП «★★★★★★»).
72.1=Занятие экстремизмом (определяется судом), – наказывается лишением свободы на срок шести лет (СПРП «★★★★★»).
72.2=Публичные призывы к осуществлению экстремистской деятельности, – наказывается лишением свободы на срок четырех лет (СПРП «★★★»).
73.1=Публичные призывы к осуществлению деятельности, направленной против безопасности Российской Федерации, либо к воспрепятствованию исполнения органами власти и их должностными лицами своих полномочий по обеспечению безопасности Российской Федерации, – наказывается лишением свободы на срок пяти лет (СПРП «★★★★»).
73.2=Публичные призывы к осуществлению действий, направленных на нарушение территориальной целостности Российской Федерации, – наказываются штрафом в размере пятидесяти тысяч (50.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★»).
74=Разглашение сведений, составляющих государственную тайну, лицом, которому она была доверена или стала известна по службе, работе, учебе или в иных случаях, предусмотренных законодательством Российской Федерации, если эти сведения стали достоянием других лиц, – наказывается лишением свободы на срок четырех лет (СПРП «★★★★»).
75=Получение сведений, составляющих государственную тайну, путем похищения, обмана, шантажа, принуждения, угрозы применения насилия либо иным незаконным способом, – наказывается лишением свободы на срок четырех лет (СПРП «★★★★»).
76.1=Использование должностным лицом своих служебных полномочий вопреки интересам службы, если это деяние совершено из корыстной или иной личной заинтересованности и повлекло существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства (злоупотребление должностными полномочиями), – наказываются штрафом в размере пятисот тысяч (500.000) рублей или лишением свободы на срок трёх лет (СПРП «★★»).
76.2=То же деяние, совершенное лицом, занимающим должность руководителя, заместителя руководителя органа государственной власти, – наказываются штрафом в размере одного миллиона (1.000.000) рублей или лишением свободы на срок шести лет (СПРП «★★★»).
76.3=Деяния, предусмотренные частями первой или второй настоящей статьи, повлекшие тяжкие последствия, – наказываются лишением свободы на срок семи лет (СПРП «★★★★»).
77.1=Совершение должностным лицом действий, явно выходящих за пределы его полномочий, вопреки установленному законом или иным нормативным правовым актом порядку совершение каких-либо действий и повлекших существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства (превышение должностных полномочий), – наказываются штрафом в размере шестиста тысяч (600.000) рублей или лишением свободы на срок трёх лет (СПРП «★★»).
77.2=То же деяние, совершенное лицом, занимающим должность руководителя, заместителя руководителя органа государственной власти, а равно главой органа местного самоуправления, – наказываются штрафом в размере двух миллионов (2.000.000) рублей или лишением свободы на срок шести лет (СПРП «★★★»).
77.3=Деяния, предусмотренные частями первой или второй настоящей статьи, если они совершены:

а) с применением насилия или угрозой применения насилия;
б) с применением оружия или специальных средств;
в) с причинением тяжких последствий;
г) группой лиц по предварительному сговору или организованной группой;
д) из корыстной или иной личной заинтересованности,

– наказываются лишением свободы от трёх до семи лет (СПРП «★★★»).
77.4=Производство сотрудником правоохранительного органа задержания при отсутствии оснований для задержания в соответствии с процессуальным законодательством, – наказываются штрафом в размере семиста тысяч (700.000) рублей или лишением свободы на срок трёх лет (СПРП «★★★»).
77.5=Незаконные требования сотрудника правоохранительного органа, – наказываются штрафом в размере восьмиста тысяч (800.000) рублей или лишением свободы на срок трёх лет (СПРП «★★★»).
78=Умышленное неисполнение сотрудником государственного органа приказа начальника, руководителя или иного лица, уполномоченного на управление либо осуществление руководства государственного органа, отданного в установленном порядке и не противоречащего закону, – наказывается штрафом в размере пятиста тысяч (500.000) рублей или лишением свободы на срок трёх лет (СПРП «★★★»).
79=Получение или дача должностным лицом или должностным лицам лично или через посредника взятки в виде денег, ценных бумаг, иного имущества либо в виде незаконных оказаний ему услуг имущественного характера, предоставления иных имущественных прав за совершение действий (бездействий) в пользу взяткодателя или представляемых им лиц, – наказывается лишением свободы на срок восьми лет (СПРП «★★★★★★»).
80.1=Ненадлежащее исполнение должностным лицом своих обязанностей вследствие недобросовестного или небрежного отношения к службе либо обязанностей по должности, если это повлекло причинение ущерба или существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства, – наказывается штрафом в размере восьмиста тысяч (800.000) рублей или лишением свободы на срок в два года (СПРП «★»).
80.2=Неисполнение должностным лицом своих обязанностей вследствие недобросовестного или небрежного отношения к службе либо обязанностей по должности, если это повлекло причинение ущерба или существенное нарушение прав и законных интересов граждан или организаций либо охраняемых законом интересов общества или государства, – наказывается лишением свободы на срок шести лет (СПРП «★★★»).
80.3=Нарушение установленных процессуальных норм о содержании действий при производстве задержания и ареста сотрудником правоохранительного органа, – наказывается штрафом в размере одного миллона (1.000.000) рублей или лишением свободы на срок в три года (СПРП «★★»).
80.4=Отказ от реализации прав задержанного или их реализация ненадлежащим образом в нарушение процессуального законодательства Российской Федерации, – наказывается штрафом в размере одного миллиона двухсот пятидесяти тысяч (1.250.000) рублей или лишением свободы на срок в три года (СПРП «★★»).
81.1=Вмешательство в какой бы то ни было форме в деятельность суда в целях воспрепятствования осуществлению правосудия, – наказывается лишением свободы на срок шесть лет (СПРП «★★★★»).
81.2=Вмешательство в какой бы то ни было форме в деятельность прокурора, следователя или лица, производящего дознание, в целях воспрепятствования всестороннему, полному и объективному расследованию дела, – наказывается лишением свободы на срок трех лет (СПРП «★★★»).
81.3=Деяния, предусмотренные частями первой или второй настоящей статьи, совершенные лицом с использованием своего служебного положения — наказываются лишением свободы на срок пяти лет (СПРП «★★★»).
81-1=Непредоставление, отказ от предоставления или предоставление заведомо недостоверных документов, материалов, статистических и иных сведений, имеющих значимость для проведения проверки сообщения о преступлении и (или) проведения предварительного расследования, по требованию (запросу) прокурора, следователя или дознавателя — наказывается штрафом в размере одного миллиона (1.000.000) рублей или лишением свободы на срок в три года (СПРП «★★»).
82=Влияние на уголовное дело (определяется судом). Оказание давления на следователя, дознавателя с целью изменения или манипулирования окончательным результатом, подменой улик или манипулированием фактами в деле, – наказывается лишением свободы на срок шесть лет (СПРП «★★★★»).
83=Влияние на судебное дело (определяется судом). Влияние на судебное дело или судью с целью изменения или манипулирования окончательным приговором в судебном деле, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
84=Неуважение к суду (определяется судом). Неуважение к суду, выразившееся в оскорблении судьи, присяжного заседателя или иного лица, участвующего в отправлении правосудия, а равно нарушение порядка, предусмотренного на судебном заседании — наказываются штрафом в размере двухсот пятидесяти тысяч (250.000) рублей или лишением свободы на срок двух лет (СПРП «★★»).
85=Привлечение заведомо невиновного к уголовной ответственности (определяется судом). Привлечение заведомо невиновного к уголовной ответственности — наказываются лишением свободы на срок десяти лет (СПРП «★★★★»).
86=Заведомо ложный донос о совершении преступления, – наказываются штрафом в размере трехста тысяч (300.000) рублей или лишением свободы на срок четырех лет (СПРП «★★★★»).
86-1=Заведомо ложные показание свидетеля, потерпевшего либо заключение или показание эксперта, показание специалиста, а равно заведомо неправильный перевод в суде либо в ходе досудебного производства, – наказывается лишением свободы на срок шесть лет (СПРП «★★★»).
86-2=Отказ свидетеля или потерпевшего от дачи показаний либо уклонение потерпевшего от прохождения освидетельствования, от производства в отношении его судебной экспертизы в случаях, когда не требуется его согласие, или от предоставления образцов почерка и иных образцов для сравнительного исследования, — наказываются штрафом в размере восемьсот тысяч (800.000) рублей или лишением свободы на срок трех лет (СПРП «★★»).
Примечание: Лицо не подлежит уголовной ответственности за отказ от дачи показаний против себя самого, своего супруга или своих близких родственников.
87.1=Побег из места лишения свободы, из-под ареста, задержания или из-под стражи, совершенный лицом, отбывающим наказание или находящимся в предварительном заключении, – наказывается лишением свободы на срок четырех лет (СПРП «★★★»).
87.2=То же деяние, совершенное:
а) группой лиц по предварительному сговору или организованной группой;
б) с применением насилия, не опасного для жизни или здоровья, либо с угрозой применения такого насилия.

– наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
87.3=Деяния, предусмотренные частями первой или второй настоящей статьи, совершенные с применением насилия, опасного для жизни или здоровья, либо с угрозой применения такого насилия, а равно с захватом заложников или иными действиями, создающими угрозу жизни и здоровью лиц, осуществляющих охрану либо конвоирование, – наказывается лишением свободы на срок восьми лет (СПРП «★★★★★»).
88=Злостное неисполнение вступивших в законную силу приговора суда, решения суда или иного судебного акта, а равно воспрепятствование их исполнению лицом, подвергнутым наказанию (определяется судом), – наказывается лишением свободы на срок двенадцати лет (СПРП «★★★★»).
88.1=Неисполнение государственным служащим (работником), являющимся субъектом процессуальных действий, решения сотрудника органов прокуратуры или следственного комитета, вынесенного в соответствии с процессуальным законодательством Российской Федерации, – наказывается лишением свободы на срок десяти лет (СПРП «★★★★»).
89=Посягательство на жизнь сотрудника правоохранительного органа, военнослужащего, а равно их близких в целях воспрепятствования законной деятельности указанных лиц по охране общественного порядка и обеспечению общественной безопасности либо из мести за такую деятельность, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
90.1=Применение насилия, не опасного для жизни или здоровья, в отношении представителя власти или его близких в связи с исполнением им своих должностных обязанностей, – наказывается лишением свободы на срок четырех лет (СПРП «★★★»).
90.2=Применение насилия, опасного для жизни или здоровья, в отношении представителя власти или его близких, – наказывается лишением свободы на срок шести лет (СПРП «★★★★»).
90.3=Угроза применения насилия в отношении представителя власти или его близких, – наказывается лишением свободы на срок двух лет (СПРП «★★»).
91=Публичное оскорбление представителя власти при исполнении им своих должностных обязанностей или в связи с их исполнением, – наказывается штрафом в размере пятидесяти тысяч (50.000) рублей или лишением свободы на срок трех лет (СПРП «★★»).
92.1=Изготовление или оборот документов (паспортов, удостоверений, иных документов, удостоверяющих личность) с поддельной фотографией, – наказывается штрафом в размере от двухсот пятидесяти тысяч (250.000) рублей до пятисот тысяч (500.000) рублей.
92.2=Подделка, изготовление или оборот поддельных документов (паспортов, удостоверений, жетонов и т.д.), государственных наград, штампов, печатей или бланков, – наказывается лишением свободы на срок шесть лет (СПРП «★★★★»).
93=Оказание помех в исполнении служебных обязанностей сотрудника государственной власти, предусмотренных его должностными полномочиями, выражающееся в намеренных попытках отвлечь после вынесения сотрудником государственной власти предупреждения о недопустимости осуществления помех, – наказывается штрафом в размере двадцати пяти тысяч (25.000) рублей или лишением свободы на срок трех лет (СПРП «★★»).
94=Присвоение лицом, не являющимся должностным, полномочий должностного лица и совершение им в связи с этим действий, которые могли повлечь существенное нарушение прав и законных интересов граждан или организаций, – наказывается штрафом в размере трехсот пятидесяти тысяч (350.000) рублей или лишением свободы на срок шести лет (СПРП «★★★»).