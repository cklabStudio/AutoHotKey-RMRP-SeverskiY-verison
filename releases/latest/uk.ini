49.2=Неправомерное завладение служебным автомобилем или иным транспортным специальным средством с нанесенными на него цветографическими схемами без цели хищения (угон), – наказываются штрафом в размере ста тысяч (100.000) рублей или лишением свободы на срок четырёх лет (СПРП «★★★★»).
50=Осуществление предпринимательской деятельности без регистрации или без лицензии (незаконное предпринимательство, определяется судом), – наказываются штрафом в размере двухсот тысяч (200.000) рублей или лишением свободы на срок двух лет (СПРП «★★»).
