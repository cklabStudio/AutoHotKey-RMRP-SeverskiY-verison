52=Уклонение от уплаты налогов, сборов, подлежащих уплате организацией в соответствии с законодательством Российской Федерации (определяется судом), – наказываются штрафом в размере пятисот тысяч (500.000) рублей или лишением свободы на срок двух лет (СПРП «★★★»).
